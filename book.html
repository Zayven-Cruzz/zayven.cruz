      { page: 14, title: "𝐋𝐄𝐒 𝐒𝐔𝐏𝐏𝐎𝐑𝐓𝐒 𝐄𝐓 𝐑É𝐒𝐈𝐒𝐓𝐀𝐍𝐂𝐄𝐒", text: "Un Support est un niveau où le prix rebondit vers le haut. Une Résistance est un plafond où le prix rejette vers le bas.", img: "https://images.pexels.com/photos/7567443/pexels-photo-7567443.jpeg?auto=compress&cs=tinysrgb&w=800", note: "🧱 Plus un niveau est testé, plus il devient fort ou prêt à casser." },
      { page: 15, title: "𝐋𝐄𝐒 𝐋𝐈𝐆𝐍𝐄𝐒 𝐃𝐄 𝐓𝐄𝐍𝐃𝐀𝐍𝐂𝐄 (𝐓𝐑𝐄𝐍𝐃𝐋𝐈𝐍𝐄𝐒)", text: "Ne tradez jamais contre la tendance principale. 'The trend is your friend'. Identifiez les sommets plus hauts (Haussière) ou plus bas (Baissière).", img: "https://images.pexels.com/photos/590022/pexels-photo-590022.jpeg?auto=compress&cs=tinysrgb&w=800", note: "🌊 Surfez sur la vague du marché, ne nagez pas à contre-courant." },
      { page: 16, title: "𝐋'𝐈𝐍𝐃𝐈𝐂𝐀𝐓𝐄𝐔𝐑 𝐌𝐀𝐂𝐃", text: "Le MACD mesure le momentum. Un croisement de la ligne MACD au-dessus de la ligne de signal indique une opportunité d'achat (CALL).", img: "https://images.pexels.com/photos/6801648/pexels-photo-6801648.jpeg?auto=compress&cs=tinysrgb&w=800", note: "📊 Utilisez le MACD en confirmation, jamais seul." },
      { page: 17, title: "𝐋𝐄𝐒 𝐌𝐎𝐘𝐄𝐍𝐍𝐄𝐒 𝐌𝐎𝐁𝐈𝐋𝐄𝐒 (𝐄𝐌𝐀)", text: "L'EMA (Moyenne Mobile Exponentielle) lisse le prix. Une EMA 20 au-dessus d'une EMA 50 confirme une forte tendance haussière.", img: "https://images.pexels.com/photos/534216/pexels-photo-534216.jpeg?auto=compress&cs=tinysrgb&w=800", note: "📉 Les EMA servent de supports et résistances dynamiques." },
      { page: 18, title: "𝐋𝐄 𝐑𝐒𝐈 (𝐑𝐄𝐋𝐀𝐓𝐈𝐕𝐄 𝐒𝐓𝐑𝐄𝐍𝐆𝐓𝐇 𝐈𝐍𝐃𝐄𝐗)", text: "Le RSI mesure la survente (<30) et la surchauffe (>70). Un RSI au-dessus de 70 indique que le prix peut bientôt chuter (PUT).", img: "https://images.pexels.com/photos/7567565/pexels-photo-7567565.jpeg?auto=compress&cs=tinysrgb&w=800", note: "⚠️ Une survente peut durer longtemps lors d'une forte tendance." },
      { page: 19, title: "𝐋𝐄𝐒 𝐁𝐀𝐍𝐃𝐄𝐒 𝐃𝐄 𝐁𝐎𝐋𝐋𝐈𝐍𝐆𝐄𝐑", text: "Les Bandes de Bollinger mesurent la volatilité. Lorsque le prix touche la bande supérieure, un retour au centre est fréquent.", img: "https://images.pexels.com/photos/6770610/pexels-photo-6770610.jpeg?auto=compress&cs=tinysrgb&w=800", note: "🎯 Cherchez les rejets sur les bandes extérieures." },

    { page: 46, title: "𝐋'𝐀𝐃𝐀𝐏𝐓𝐀𝐁𝐈𝐋𝐈𝐓É 𝐀𝐔𝐗 𝐌𝐀𝐑𝐂𝐇É𝐒", text: "Le marché évolue selon les heures (Session de Londres, New York, Asie). Adaptez vos stratégies selon la volatilité de la session active.", img: "https://images.pexels.com/photos/6801648/pexels-photo-6801648.jpeg?auto=compress&cs=tinysrgb&w=800", note: "🌍 La session de Londres et NY offrent le plus de liquidité." },
    { page: 47, title: "𝐋𝐄 𝐂𝐀𝐋𝐂𝐔𝐋 𝐃𝐄 𝐕𝐎𝐓𝐑𝐄 𝐖𝐈𝐍𝐑𝐀𝐓𝐄", text: "Calculez votre pourcentage de réussite : (Trades Gagnés / Total Trades) x 100. Un Winrate de 65% avec une bonne gestion vous rend très riche.", img: "https://images.pexels.com/photos/534216/pexels-photo-534216.jpeg?auto=compress&cs=tinysrgb&w=800", note: "📊 Suivez vos statistiques chaque fin de mois." },
    { page: 48, title: "𝐋𝐄 𝐌𝐈𝐍𝐃𝐒𝐄𝐓 𝐃'𝐔𝐍 𝐓𝐑𝐀𝐃𝐄𝐑 𝐏𝐑𝐎", text: "Le trader pro ne cherche pas à avoir toujours raison, il cherche à bien exécuter son plan et à gérer son risque sans état d'âme.", img: "https://images.pexels.com/photos/7567565/pexels-photo-7567565.jpeg?auto=compress&cs=tinysrgb&w=800", note: "🎯 Concentrez-vous sur le processus, pas sur l'argent." },
    { page: 49, title: "𝐋𝐄 𝐂𝐄𝐂𝐈 𝐍'𝐄𝐒𝐓 𝐏𝐀𝐒 𝐔𝐍 𝐉𝐄𝐔 𝐃𝐄 𝐇𝐀𝐒𝐀𝐑𝐃", text: "Traiter les options binaires comme un casino garantit votre ruine. Traitez-les comme une entreprise financière rigoureuse.", img: "https://images.pexels.com/photos/6770610/pexels-photo-6770610.jpeg?auto=compress&cs=tinysrgb&w=800", note: "🎰 Le casino gagne toujours, soyez la banque !" },

  ];

  let currentPage = 1;
  const totalPages = bookData.length;

  function renderBook() {
    const container = document.getElementById('book-container');
    const strip = document.getElementById('numberStrip');
    
    if (!container || !strip) return;

    container.innerHTML = '';
    strip.innerHTML = '';

    bookData.forEach((data) => {
      // Build Card
      const card = document.createElement('div');
      card.className = `page-card ${data.page === 1 ? 'active' : ''}`;
      card.id = `page-${data.page}`;
      card.innerHTML = `
        <img src="${data.img}" class="page-banner" alt="Page ${data.page}">
        <div class="page-content">
          <span class="page-number-badge">𝐏𝐀𝐆𝐄 ${data.page} / ${totalPages}</span>
          <h2 class="page-title">${data.title}</h2>
          <p class="page-body-text">${data.text}</p>
          <div class="highlight-box">${data.note}</div>
        </div>
      `;
      container.appendChild(card);

      // Build Number Strip Button
      const numBtn = document.createElement('button');
      numBtn.className = `num-btn ${data.page === 1 ? 'active' : ''}`;
      numBtn.id = `num-${data.page}`;
      numBtn.innerText = data.page;
      numBtn.onclick = function() { goToPage(data.page); };
      strip.appendChild(numBtn);
    });

    updateControls();
  }

  function goToPage(pageNumber) {
    const activeCard = document.querySelector('.page-card.active');
    const activeNumBtn = document.querySelector('.num-btn.active');
    
    if (activeCard) activeCard.classList.remove('active');
    if (activeNumBtn) activeNumBtn.classList.remove('active');

    currentPage = pageNumber;

    const newCard = document.getElementById(`page-${currentPage}`);
    const newNumBtn = document.getElementById(`num-${currentPage}`);

    if (newCard) newCard.classList.add('active');
    if (newNumBtn) {
      newNumBtn.classList.add('active');
      newNumBtn.scrollIntoView({ behavior: 'smooth', inline: 'center' });
    }

    updateControls();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function changePage(direction) {
    let newPage = currentPage + direction;
    if (newPage >= 1 && newPage <= totalPages) {
      goToPage(newPage);
    }
  }

  function updateControls() {
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const pageIndicator = document.getElementById('pageIndicator');

    if (prevBtn) prevBtn.disabled = currentPage === 1;
    if (nextBtn) nextBtn.disabled = currentPage === totalPages;
    if (pageIndicator) pageIndicator.innerText = `𝐏𝐚𝐠𝐞 ${currentPage} / ${totalPages}`;
  }

  // Chaje liv la san tann
  document.addEventListener("DOMContentLoaded", function() {
    renderBook();
  });
</script>
