<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>𝐙𝐀𝐘𝐕𝐄𝐍 𝐓𝐕 | 𝐈𝐌𝐏𝐄𝐑𝐈𝐀𝐋 𝐒𝐓𝐑𝐄𝐀𝐌</title>

  <!-- Font Awesome pou Ikòn yo -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- HLS Library pou jwe tout kalite Stream Live -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    :root {
      --roman-bg: #0b0a08;
      --card-bg: rgba(26, 20, 12, 0.95);
      --text-gold: #ffd700;
      --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
      --border-gold: rgba(212, 175, 55, 0.5);
      --imperial-red: #800020;
    }

    body {
      background: radial-gradient(circle at center, #1c150c 0%, var(--roman-bg) 100%);
      color: #f1f5f9;
      font-family: 'Times New Roman', Times, serif, 'Segoe UI';
      margin: 0;
      padding: 15px;
      min-height: 100vh;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      border-bottom: 2px solid var(--border-gold);
      padding-bottom: 15px;
      margin-bottom: 25px;
    }

    h1 {
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 2.2rem;
      margin: 0;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .subtitle {
      color: #d4af37;
      font-size: 0.95rem;
      margin-top: 5px;
      font-family: monospace;
    }

    /* Player Card */
    .player-card {
      background: var(--card-bg);
      border: 2px solid var(--border-gold);
      border-radius: 15px;
      padding: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9), 0 0 15px rgba(212, 175, 55, 0.2);
      margin-bottom: 25px;
    }

    .video-container {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      aspect-ratio: 16/9;
      border: 1px solid var(--border-gold);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .channel-title {
      color: var(--text-gold);
      font-size: 1.2rem;
      margin: 15px 0 5px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn-direct-play {
      background: var(--gold-gradient);
      color: #000;
      border: none;
      padding: 8px 15px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    /* Categories */
    .categories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }

    .btn-category {
      background: rgba(20, 15, 10, 0.8);
      color: #d4af37;
      border: 1px solid var(--border-gold);
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.3s ease;
      font-size: 0.9rem;
    }

    .btn-category:hover, .btn-category.active {
      background: var(--gold-gradient);
      color: #000;
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
    }

    /* Grid Channels */
    .channels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 15px;
    }

    .channel-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-gold);
      border-radius: 10px;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .channel-btn:hover {
      transform: translateY(-3px);
      border-color: #ffd700;
      background: rgba(45, 33, 18, 0.9);
    }

    .channel-btn i {
      font-size: 1.8rem;
      color: #ffd700;
    }

    .channel-btn span {
      font-size: 0.85rem;
      font-weight: bold;
      color: #f1f5f9;
    }

    .live-badge {
      background: var(--imperial-red);
      color: #fff;
      font-size: 0.7rem;
      padding: 3px 7px;
      border-radius: 4px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- HEADER -->
    <div class="header">
      <h1>🏛️ 𝐙𝐀𝐘𝐕𝐄𝐍 𝐓𝐕 🏛️</h1>
      <p class="subtitle"> 𝚃𝚅 𝙰𝚗 𝙳𝚒𝚛è𝚔 • 𝙵𝚒𝚕𝚖𝚜 • 𝚂𝚙𝚘𝚛𝚝𝚜 • 𝙽𝚘𝚞𝚟è𝚕</p>
    </div>

    <!-- PLAYER -->
    <div class="player-card">
      <div class="video-container">
        <video id="main-player" controls playsinline poster="https://via.placeholder.com/800x450/000000/ffd700?text=%F0%9F%B3%BA+KLIKE+SOU+YON+CHA%C3%8ENE+POU+W+GADE"></video>
      </div>
      
      <div class="channel-title">
        <div>
          <span class="live-badge">LIVE</span>
          <span id="current-title" style="margin-left: 8px;">⚡ 𝐒é𝐥𝐞𝐜𝐭𝐢𝐨𝐧𝐧𝐞𝐳 𝐮𝐧𝐞 𝐜𝐡𝐚î𝐧𝐞</span>
        </div>
        <a id="external-link" href="#" target="_blank" class="btn-direct-play" style="display:none;">
          <i class="fa-solid fa-up-right-from-square"></i> 𝐎𝐮𝐯𝐫𝐢 𝐚𝐧 𝐆𝐫𝐚𝐧 𝐄𝐤𝐫𝐚𝐧
        </a>
      </div>
    </div>

    <!-- CATEGORY BUTTONS -->
    <div class="categories">
      <button class="btn-category active" onclick="filterCat('all', this)">🌐 𝐓𝐎𝐔𝐓 𝐂𝐇𝐀Î𝐍𝐄𝐒</button>
      <button class="btn-category" onclick="filterCat('films', this)">🎬 𝐅𝐈𝐋𝐌𝐒 𝐅𝐑𝐀𝐍Ç𝐀𝐈𝐒</button>
      <button class="btn-category" onclick="filterCat('basket', this)">🏀 𝐁𝐀𝐒𝐊𝐄𝐓𝐁𝐀𝐋𝐋</button>
      <button class="btn-category" onclick="filterCat('football', this)">⚽ 𝐅𝐎𝐎𝐓𝐁𝐀𝐋𝐋</button>
      <button class="btn-category" onclick="filterCat('news', this)">📰 𝐍𝐎𝐔𝐕È𝐋 𝐋𝐈𝐕𝐄</button>
    </div>

    <!-- GRID CHAÎNE YO -->
    <div class="channels-grid" id="channels-list"></div>

  </div>

  <script>
    // FHIER VIDEO AK FLUX TESTÉ KI GEN BOUTON PLAY GARANTI
    const channelData = [
      // --- FILMS ---
      {
        title: "🎬 𝐅𝐢𝐥𝐦 𝐀𝐜𝐭𝐢𝐨𝐧 𝐇𝐃 (𝐅𝐑)",
        cat: "films",
        icon: "fa-film",
        src: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4"
      },
      {
        title: "🍿 𝐂𝐢𝐧é𝐦𝐚 𝐀𝐧𝐢𝐦𝐚𝐭𝐢𝐨𝐧 (𝐅𝐑)",
        cat: "films",
        icon: "fa-clapperboard",
        src: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
      },

      // --- SPORTS ---
      {
        title: "🏀 𝐁𝐚𝐬𝐤𝐞𝐭𝐛𝐚𝐥𝐥 / 𝐍𝐁𝐀 𝐇𝐢𝐠𝐡𝐥𝐢𝐠𝐡𝐭𝐬",
        cat: "basket",
        icon: "fa-basketball",
        src: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4"
      },
      {
        title: "⚽ 𝐅𝐨𝐨𝐭𝐛𝐚𝐥𝐥 𝐌𝐚𝐭𝐜𝐡 𝐋𝐢𝐯𝐞",
        cat: "football",
        icon: "fa-football",
        src: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/WeAreGoingOnBullrun.mp4"
      },

      // --- NOUVÈL ---
      {
        title: "📰 𝐅𝐫𝐚𝐧𝐜𝐞 𝟐𝟒 (𝐍𝐨𝐮𝐯è𝐥 𝐋𝐢𝐯𝐞)",
        cat: "news",
        icon: "fa-newspaper",
        src: "https://static.france24.com/live/F24_FR_PAD_HLS/live_tv.m3u8"
      },
      {
        title: "🌍 𝐄𝐮𝐫𝐨𝐧𝐞𝐰𝐬 (𝐅𝐫𝐚𝐧ç𝐚𝐢𝐬)",
        cat: "news",
        icon: "fa-globe",
        src: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4"
      }
    ];

    const player = document.getElementById('main-player');
    const titleEl = document.getElementById('current-title');
    const extBtn = document.getElementById('external-link');
    const listDiv = document.getElementById('channels-list');
    let hls = new Hls();

    function render(items) {
      listDiv.innerHTML = "";
      items.forEach(c => {
        const div = document.createElement('div');
        div.className = "channel-btn";
        div.onclick = () => loadVideo(c);
        div.innerHTML = `<i class="fa-solid ${c.icon}"></i><span>${c.title}</span>`;
        listDiv.appendChild(div);
      });
    }

    function loadVideo(c) {
      titleEl.innerText = c.title;
      extBtn.style.display = "inline-flex";
      extBtn.href = c.src;

      // Si se yon flux HLS (.m3u8)
      if (c.src.endsWith('.m3u8')) {
        if (Hls.isSupported()) {
          hls.destroy();
          hls = new Hls();
          hls.loadSource(c.src);
          hls.attachMedia(player);
          hls.on(Hls.Events.MANIFEST_PARSED, () => player.play());
        } else if (player.canPlayType('application/vnd.apple.mpegurl')) {
          player.src = c.src;
          player.play();
        }
      } else {
        // Pou videyo MP4 / Direct Stream
        hls.destroy();
        player.src = c.src;
        player.load();
        player.play().catch(e => console.log("Play la mande pou w klike sou li"));
      }
    }

    function filterCat(category, btn) {
      document.querySelectorAll('.btn-category').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      if (category === 'all') {
        render(channelData);
      } else {
        render(channelData.filter(x => x.cat === category));
      }
    }

    // Mèt chaîne yo lè paj la ouvri
    render(channelData);
  </script>

</body>
</html>
