<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>𝐙𝐀𝐘𝐕𝐄𝐍 𝐓𝐕 | 𝐈𝐌𝐏𝐄𝐑𝐈𝐀𝐋 𝐒𝐓𝐑𝐄𝐀𝐌</title>

  <!-- Font Awesome pou Ikòn yo -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --roman-bg: #0b0a08;
      --card-bg: rgba(26, 20, 12, 0.9);
      --text-gold: #ffd700;
      --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
      --border-gold: rgba(212, 175, 55, 0.4);
      --imperial-red: #800020;
    }

    body {
      background: radial-gradient(circle at center, #1c150c 0%, var(--roman-bg) 100%);
      color: #f1f5f9;
      font-family: 'Times New Roman', Times, serif, 'Segoe UI';
      margin: 0;
      padding: 15px;
      min-height: 100vh;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    /* Header ak Style Alemi Wòm */
    .header {
      text-align: center;
      border-bottom: 2px solid var(--border-gold);
      padding-bottom: 15px;
      margin-bottom: 25px;
    }

    h1 {
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 2.5rem;
      margin: 0;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(212, 175, 55, 0.2);
    }

    .subtitle {
      color: #d4af37;
      font-size: 1rem;
      margin-top: 5px;
      font-family: monospace;
    }

    /* Player TV Screen */
    .player-card {
      background: var(--card-bg);
      border: 2px solid var(--border-gold);
      border-radius: 15px;
      padding: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(212, 175, 55, 0.2);
      margin-bottom: 25px;
    }

    .video-container {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      aspect-ratio: 16/9;
      border: 1px solid var(--border-gold);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .channel-title {
      color: var(--text-gold);
      font-size: 1.3rem;
      margin: 12px 0 5px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Bouton Kategori yo (Tabs) */
    .categories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 20px;
      scrollbar-width: thin;
    }

    .btn-category {
      background: rgba(20, 15, 10, 0.8);
      color: #d4af37;
      border: 1px solid var(--border-gold);
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.3s ease;
      font-size: 0.95rem;
    }

    .btn-category:hover, .btn-category.active {
      background: var(--gold-gradient);
      color: #000;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
    }

    /* Liste des Chaînes Grid */
    .channels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
    }

    .channel-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-gold);
      border-radius: 10px;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .channel-btn:hover {
      transform: translateY(-3px);
      border-color: #ffd700;
      box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
      background: rgba(45, 33, 18, 0.9);
    }

    .channel-btn i {
      font-size: 1.8rem;
      color: #ffd700;
    }

    .channel-btn span {
      font-size: 0.9rem;
      font-weight: bold;
      color: #f1f5f9;
    }

    .live-badge {
      background: var(--imperial-red);
      color: #fff;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- HEADER STYLE WÒM / LÒ -->
    <div class="header">
      <h1>🏛️ 𝐙𝐀𝐘𝐕𝐄𝐍 𝐓𝐕 🏛️</h1>
      <p class="subtitle"> 𝚃𝚅 𝙰𝚗 𝙳𝚒𝚛è𝚔 • 𝙵𝚒𝚕𝚖𝚜 • 𝚂𝚙𝚘𝚛𝚝𝚜 • 𝙽𝚘𝚞𝚟è𝚕</p>
    </div>

    <!-- PLAYER CARD (IFRAME SYSTEM POU ELIMINE PA VİRE A) -->
    <div class="player-card">
      <div class="video-container">
        <iframe id="tv-frame" src="https://www.youtube.com/embed/wwNZJr9xjTM?autoplay=1" allowfullscreen allow="autoplay"></iframe>
      </div>
      <div class="channel-title">
        <span class="live-badge">LIVE</span>
        <span id="current-channel-name">📰 𝐅𝐫𝐚𝐧𝐜𝐞 𝟐𝟒 (𝐅𝐫𝐚𝐧ç𝐚𝐢𝐬)</span>
      </div>
    </div>

    <!-- CATEGORY BUTTONS -->
    <div class="categories">
      <button class="btn-category active" onclick="filterChannels('all', this)">
        🌐 𝐓𝐎𝐔𝐓 𝐂𝐇𝐀Î𝐍𝐄𝐒
      </button>
      <button class="btn-category" onclick="filterChannels('films', this)">
        🎬 𝐅𝐈𝐋𝐌𝐒 𝐅𝐑𝐀𝐍Ç𝐀𝐈𝐒
      </button>
      <button class="btn-category" onclick="filterChannels('basket', this)">
        🏀 𝐁𝐀𝐒𝐊𝐄𝐓𝐁𝐀𝐋𝐋
      </button>

      <button class="btn-category" onclick="filterChannels('football', this)">
        ⚽ 𝐅𝐎𝐎𝐓𝐁𝐀𝐋𝐋
      </button>

      <button class="btn-category" onclick="filterChannels('haiti', this)">
        🇭🇹 𝐍𝐎𝐔𝐕È𝐋 𝐀𝐘𝐈𝐓𝐈
      </button>
      <button class="btn-category" onclick="filterChannels('news', this)">
        📰 𝐍𝐎𝐔𝐕È𝐋 𝐄𝐍𝐓È𝐍𝐀𝐒𝐘𝐎𝐍𝐀𝐋
      </button>
    </div>

    <!-- CHANNELS LIST GRID -->
    <div class="channels-grid" id="channels-container"></div>

  </div>

  <script>
    // LISTE TOUT CHAÎNE AK SERVEUR EMBED KI PA JANM BLOKE
    const channels = [
      // --- FILMS AN FRANÇAIS ---
      {
        name: "🎬 𝐅𝐢𝐥𝐦 𝐀𝐜𝐭𝐢𝐨𝐧 (𝐅𝐑)",
        category: "films",
        icon: "fa-film",
        embedUrl: "https://www.youtube.com/embed/live_stream?channel=UCq-Fj5jknLsUf-MWSy4_brA" 
      },
      {
        name: "🍿 𝐂𝐢𝐧é𝐦𝐚 𝐇𝐃 (𝐅𝐑)",
        category: "films",
        icon: "fa-clapperboard",
        embedUrl: "https://vidsrc.to/embed/movie/tt0111161" 
      },

      // --- BASKETBALL ---
      {
        name: "🏀 𝐍𝐁𝐀 / 𝐁𝐚𝐬𝐤𝐞𝐭 𝐋𝐢𝐯𝐞",
        category: "basket",
        icon: "fa-basketball",
        embedUrl: "https://www.youtube.com/embed/5qap5aO4i9A"
      },

      // --- FOOTBALL ---
      {
        name: "⚽ 𝐅𝐨𝐨𝐭𝐛𝐚𝐥𝐥 𝐋𝐢𝐯𝐞 𝐒𝐩𝐨𝐫𝐭",
        category: "football",
        icon: "fa-football",
        embedUrl: "https://www.youtube.com/embed/live_stream?channel=UC14UlmYlSNiQCcq9m_Foj6w"
      },

      // --- NOUVÈL AYITI ---
      {
        name: "🇭🇹 𝐓é𝐥é 𝐆𝐚𝐥𝐚𝐱𝐢𝐞 (𝐀𝐲𝐢𝐭𝐢)",
        category: "haiti",
        icon: "fa-tv",
        embedUrl: "https://www.youtube.com/embed/live_stream?channel=UCY4SOnI1f2k2YwY9Nre88tA"
      },
      {
        name: "🇭🇹 𝐓é𝐥é 𝐏𝐚𝐧𝐨𝐫𝐚𝐦𝐚 (𝐀𝐲𝐢𝐭𝐢)",
        category: "haiti",
        icon: "fa-landmark",
        embedUrl: "https://www.youtube.com/embed/live_stream?channel=UC4S14e3DkC94i94d50vK40A"
      },

      // --- NOUVÈL ENTÈNASYONAL ---
      {
        name: "📰 𝐅𝐫𝐚𝐧𝐜𝐞 𝟐𝟒 (𝐅𝐫𝐚𝐧ç𝐚𝐢𝐬)",
        category: "news",
        icon: "fa-newspaper",
        embedUrl: "https://www.youtube.com/embed/wwNZJr9xjTM?autoplay=1"
      },
      {
        name: "🌎 𝐄𝐮𝐫𝐨𝐧𝐞𝐰𝐬 (𝐅𝐑)",
        category: "news",
        icon: "fa-globe",
        embedUrl: "https://www.youtube.com/embed/gCNeDWCI010?autoplay=1"
      },
      {
        name: "🔴 𝐁𝐅𝐌 𝐓𝐕 (𝐋𝐢𝐯𝐞)",
        category: "news",
        icon: "fa-circle-play",
        embedUrl: "https://www.youtube.com/embed/live_stream?channel=UC93p__wAtM-P45zQ92996_w"
      }
    ];

    const frame = document.getElementById('tv-frame');
    const channelNameEl = document.getElementById('current-channel-name');
    const container = document.getElementById('channels-container');

    function renderChannels(items) {
      container.innerHTML = "";
      items.forEach(ch => {
        const card = document.createElement('div');
        card.className = "channel-btn";
        card.onclick = () => playChannel(ch);
        card.innerHTML = `
          <i class="fa-solid ${ch.icon}"></i>
          <span>${ch.name}</span>
        `;
        container.appendChild(card);
      });
    }

    function playChannel(ch) {
      channelNameEl.innerText = ch.name;
      frame.src = ch.embedUrl;
    }

    function filterChannels(cat, btn) {
      document.querySelectorAll('.btn-category').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      if (cat === 'all') {
        renderChannels(channels);
      } else {
        const filtered = channels.filter(c => c.category === cat);
        renderChannels(filtered);
      }
    }

    // Chaje tout chaîne yo
    renderChannels(channels);
  </script>

</body>
</html>
